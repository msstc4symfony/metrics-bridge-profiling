name: Code Quality Checks

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standard:
    uses: msstc4symfony/bundle-standard/.github/workflows/php-bundle.yml@v1.8.0
    with:
      slug: msstc4symfony/metrics-bridge-profiling
      extensions: 'mbstring, xml, ctype, iconv, intl, json, redis'
      infection-min-msi: 93
      infection-min-covered-msi: 93
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
